<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Genome Intelligence v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b1120;color:#e2e8f0;line-height:1.6}
.container{max-width:800px;margin:0 auto;padding:48px 20px}
h1{font-size:32px;margin-bottom:8px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#64748b;margin-bottom:40px}
.card{background:#151e32;border-radius:16px;padding:24px;margin-bottom:16px;border:1px solid #1e293b}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.required{color:#ef4444}
.optional{background:#1e293b;color:#64748b;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:auto}
.dropzone{border:2px dashed #334155;border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.dropzone:hover{border-color:#60a5fa;background:#1e293b}
.dropzone.dragover{border-color:#60a5fa;background:#1e293b;transform:scale(1.02)}
.dropzone input{display:none}
.file-name{margin-top:8px;font-size:13px;color:#60a5fa}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;position:relative;overflow:hidden}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.6;cursor:not-allowed}
.status{margin-top:16px;padding:12px;border-radius:8px;font-size:14px;display:none}
.status.success{background:#064e3b;color:#6ee7b7;display:block}
.status.error{background:#450a0a;color:#fca5a5;display:block}
.status.info{background:#1e3a5f;color:#93c5fd;display:block}
textarea{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;color:#e2e8f0;font-family:monospace;font-size:13px;resize:vertical}
.hint{font-size:12px;color:#64748b;margin-top:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}

/* Loading spinner */
.spinner{display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s ease-in-out infinite;margin-right:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.loading .spinner{display:inline-block}
.btn.loading{color:transparent}

/* Progress bar */
.progress-container{display:none;margin-top:12px;background:#0f172a;border-radius:8px;height:8px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:8px;transition:width .3s}

/* Tag pills */
.tag{display:inline-flex;align-items:center;gap:6px;background:#1e293b;padding:4px 12px;border-radius:20px;font-size:12px;margin:4px 4px 0 0}
.tag .remove{cursor:pointer;color:#64748b;font-weight:700}
.tag .remove:hover{color:#ef4444}
</style>
</head>
<body>
<div class="container">
<h1>DNA Genome Intelligence v2.1</h1>
<p class="subtitle">知识图谱驱动 · 规则推理引擎 · 个人健康智能</p>

<form id="uploadForm" enctype="multipart/form-data">

<!-- VCF -->
<div class="card">
<div class="card-title">📄 VCF 基因文件 <span class="required">*</span></div>
<div class="dropzone" id="vcfZone">
<input type="file" name="vcf" accept=".vcf,.vcf.gz" id="vcfInput">
<div class="dz-text">📁 点击或拖拽上传 .vcf / .vcf.gz</div>
<div class="file-name" id="vcfName"></div>
</div>
</div>

<!-- Profile -->
<div class="card">
<div class="card-title">👤 个人健康档案 <span class="optional">可选</span></div>
<div class="dropzone" id="profileZone">
<input type="file" name="profile" accept=".json" id="profileInput">
<div class="dz-text">📁 上传 profile.json</div>
<div class="file-name" id="profileName"></div>
</div>
<p class="hint">或直接粘贴 JSON（症状、病史、家族史）：</p>
<textarea name="profile_json" rows="5" id="profileJson" placeholder='{
  "basic": {"age": 38, "sex": "female"},
  "conditions": ["anxiety", "insomnia"],
  "medications": ["bupropion"],
  "family_history": [
    {"condition": "pancreatitis", "relation": "father"},
    {"condition": "breast cancer", "relation": "mother"}
  ],
  "lab_results": {"LDL": {"value": 140, "unit": "mg/dL"}}
}'></textarea>
</div>

<!-- Apple Health -->
<div class="card">
<div class="card-title">🍎 Apple Health 导出 <span class="optional">可选</span></div>
<div class="dropzone" id="healthZone">
<input type="file" name="health" accept=".xml" id="healthInput">
<div class="dz-text">📁 上传 export.xml（iPhone 健康 App 导出）</div>
<div class="file-name" id="healthName"></div>
</div>
<p class="hint">将在报告中显示关键健康指标趋势</p>
</div>

<!-- Hospital Reports -->
<div class="card">
<div class="card-title">🏥 医院检验报告 <span class="optional">可选</span></div>
<div class="dropzone" id="reportZone">
<input type="file" name="reports" accept=".pdf,.png,.jpg,.jpeg,.txt,.csv" multiple id="reportInput">
<div class="dz-text">📁 上传 PDF / 图片 / 文本（可多选）</div>
<div class="file-name" id="reportName"></div>
</div>
<p class="hint">血常规、生化、影像报告等，用于横向对比基因风险</p>
</div>

<!-- Params -->
<div class="card">
<div class="card-title">⚙️ 分析参数</div>
<div class="row">
<div>
<label style="font-size:13px;color:#94a3b8">最大变异数</label>
<input type="number" name="max_variants" value="50000" style="width:100%;margin-top:6px;padding:10px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0">
</div>
<div>
<label style="font-size:13px;color:#94a3b8">最低评分（0=显示全部）</label>
<input type="number" name="min_score" value="0" style="width:100%;margin-top:6px;padding:10px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0">
</div>
</div>
</div>

<button type="submit" class="btn" id="submitBtn">
<span class="spinner"></span>
<span class="btn-text">开始分析</span>
</button>

<div class="progress-container" id="progressContainer">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="status" class="status"></div>

</form>
</div>

<script>
// Drag & drop + file picker
function setupDropzone(zoneId, inputId, nameId) {
  var zone = document.getElementById(zoneId);
  var input = document.getElementById(inputId);
  var nameEl = document.getElementById(nameId);
  zone.addEventListener('click', function(){input.click();});
  zone.addEventListener('dragover', function(e){e.preventDefault();zone.classList.add('dragover');});
  zone.addEventListener('dragleave', function(){zone.classList.remove('dragover');});
  zone.addEventListener('drop', function(e){
    e.preventDefault();zone.classList.remove('dragover');
    input.files = e.dataTransfer.files;
    showFile(input, nameEl);
  });
  input.addEventListener('change', function(){showFile(input, nameEl);});
}

function showFile(input, nameEl) {
  var names = Array.from(input.files).map(function(f){return f.name}).join(', ');
  nameEl.textContent = names || '';
}

setupDropzone('vcfZone', 'vcfInput', 'vcfName');
setupDropzone('profileZone', 'profileInput', 'profileName');
setupDropzone('healthZone', 'healthInput', 'healthName');
setupDropzone('reportZone', 'reportInput', 'reportName');

// Submit with progress
var form = document.getElementById('uploadForm');
var btn = document.getElementById('submitBtn');
var status = document.getElementById('status');
var progressBar = document.getElementById('progressBar');
var progressContainer = document.getElementById('progressContainer');

form.onsubmit = function(e) {
  e.preventDefault();
  if (!document.getElementById('vcfInput').files.length) {
    status.className = 'status error';
    status.textContent = '请先选择 VCF 文件';
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');
  document.querySelector('.btn-text').textContent = '解析 VCF 中...';
  status.className = 'status info';
  status.textContent = '正在解析 VCF 文件，查询 ClinVar 知识图谱...';
  progressContainer.style.display = 'block';
  progressBar.style.width = '10%';

  var xhr = new XMLHttpRequest();
  var fd = new FormData(form);

  xhr.upload.addEventListener('progress', function(e) {
    if (e.lengthComputable) {
      var pct = Math.round((e.loaded / e.total) * 40) + 10;
      progressBar.style.width = pct + '%';
      document.querySelector('.btn-text').textContent = '上传中 ' + pct + '%';
    }
  });

  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      progressBar.style.width = '100%';
      btn.disabled = false;
      btn.classList.remove('loading');

      try {
        var data = JSON.parse(xhr.responseText);
        if (data.success) {
          status.className = 'status success';
          status.innerHTML = '🎉 分析完成！发现 <strong>' + data.reported + '</strong> 条相关变异。<br>正在打开报告...';
          setTimeout(function(){window.open(data.redirect, '_blank');}, 600);
        } else {
          status.className = 'status error';
          status.textContent = data.error || '分析失败';
          document.querySelector('.btn-text').textContent = '开始分析';
        }
      } catch(err) {
        status.className = 'status error';
        status.textContent = '服务器错误: ' + xhr.status;
        document.querySelector('.btn-text').textContent = '开始分析';
      }
    }
  };

  xhr.onerror = function() {
    btn.disabled = false;
    btn.classList.remove('loading');
    status.className = 'status error';
    status.textContent = '网络错误，请重试';
    document.querySelector('.btn-text').textContent = '开始分析';
  };

  xhr.open('POST', '/api/analyze');
  xhr.send(fd);
};
</script>
</body>
</html>
